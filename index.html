<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Game Spawn Fix</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

<script>
    // --- 1. シーン・カメラ・レンダラーの設定 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- 2. スポーン地点の修正（めり込み防止対策） ---
    // 建物の位置が (0, 0, 0) 付近にある場合、スポーン地点を高さ方向(Y軸)やY/Z軸方向へずらします。
    // 例: Y=5 (空中から着地させる)、Z=10 (建物の手前) に設定
    const SPAWN_POSITION = new THREE.Vector3(0, 5, 10);
    camera.position.copy(SPAWN_POSITION);

    // --- 3. コントロール（視点操作と移動制御） ---
    const controls = new THREE.PointerLockControls(camera, document.body);

    document.addEventListener('click', () => {
        controls.lock();
    });

    const moveState = { forward: false, backward: false, left: false, right: false };
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let prevTime = performance.now();

    // キー入力リスナー
    window.addEventListener('keydown', (e) => {
        switch (e.code) {
            case 'KeyW': moveState.forward = true; break;
            case 'KeyS': moveState.backward = true; break;
            case 'KeyA': moveState.left = true; break;
            case 'KeyD': moveState.right = true; break;
        }
    });

    window.addEventListener('keyup', (e) => {
        switch (e.code) {
            case 'KeyW': moveState.forward = false; break;
            case 'KeyS': moveState.backward = false; break;
            case 'KeyA': moveState.left = false; break;
            case 'KeyD': moveState.right = false; break;
        }
    });

    // --- 4. 環境（地面と建物）の配置 ---
    // 地面
    const floorGeometry = new THREE.PlaneGeometry(100, 100);
    const floorMaterial = new THREE.MeshBasicMaterial({ color: 0x555555 });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // 初期位置に重なっていた建物（原点付近）
    const buildingGeometry = new THREE.BoxGeometry(4, 8, 4);
    const buildingMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
    const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
    building.position.set(0, 4, 0); // 原点に配置されている建物
    scene.add(building);

    // --- 5. メインループ（移動更新） ---
    function animate() {
        requestAnimationFrame(animate);

        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        if (controls.isLocked) {
            // 減衰処理
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            direction.z = Number(moveState.forward) - Number(moveState.backward);
            direction.x = Number(moveState.right) - Number(moveState.left);
            direction.normalize();

            // 移動速度の設定
            const speed = 40.0;
            if (moveState.forward || moveState.backward) velocity.z -= direction.z * speed * delta;
            if (moveState.left || moveState.right) velocity.x -= direction.x * speed * delta;

            // 実際の移動適用
            controls.moveRight(-velocity.x * delta);
            controls.moveForward(-velocity.z * delta);
        }

        prevTime = time;
        renderer.render(scene, camera);
    }

    animate();

    // ウィンドウサイズ変更対応
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
