<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D City Survival - 完全修正版 v2</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0b16;
            color: #fff;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 15, 25, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
        h1 { font-size: 20px; margin: 0 0 10px 0; color: #00ffcc; letter-spacing: 1px; }
        .stat-item { margin: 8px 0; font-size: 15px; display: flex; justify-content: space-between; width: 220px; }
        .stat-value { font-weight: bold; color: #ffeb3b; }
        #instructions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 14px;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.2);
            box-style: glow;
            letter-spacing: 0.5px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #msg {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.7);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>CITY SURVIVAL V2</h1>
        <div class="stat-item"><span>獲得アイテム:</span><span id="score" class="stat-value">0 / 5</span></div>
        <div class="stat-item"><span>ステータス:</span><span id="status" class="stat-value" style="color:#00ffcc;">探索中</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="msg">アイテムを獲得しました！</div>
    <div id="instructions">WASD: 移動 | Shift: ダッシュ | SPACE: ジャンプ | マウス: 視点操作 (クリックしてロック)</div>

    <!-- Three.js & PointerLockControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        // --- シーン・カメラ・レンダラーのセットアップ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0e101c);
        scene.fog = new THREE.FogExp2(0x0e101c, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- ライティング ---
        const ambientLight = new THREE.AmbientLight(0xddeeff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(30, 60, 30);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        const d = 50;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- 地面 (道路と区画) ---
        const groundGeo = new THREE.PlaneGeometry(120, 120);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x1b1d28, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // 道路ラインのグリッド装飾
        const gridHelper = new THREE.GridHelper(120, 30, 0x334455, 0x222638);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // --- 1. 場外防止のための透明な壁 (Invisible Boundaries) ---
        const boundarySize = 110;
        const boundaryHeight = 30;
        const wallMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 }); // 完全透明

        function createBoundaryWall(x, z, w, d) {
            const geom = new THREE.BoxGeometry(w, boundaryHeight, d);
            const wall = new THREE.Mesh(geom, wallMat);
            wall.position.set(x, boundaryHeight / 2, z);
            scene.add(wall);
            return { mesh: wall, box: new THREE.Box3().setFromObject(wall) };
        }

        const boundaryWalls = [
            createBoundaryWall(0, -boundarySize/2, boundarySize, 2), // 北
            createBoundaryWall(0, boundarySize/2, boundarySize, 2),  // 南
            createBoundaryWall(-boundarySize/2, 0, 2, boundarySize), // 西
            createBoundaryWall(boundarySize/2, 0, 2, boundarySize)  // 東
        ];

        // --- 3. ビル群の作成と共通衝突判定リスト ---
        const obstacles = [];
        const buildingColors = [0x2c3e50, 0x34495e, 0x3a405a, 0x263238];

        function createBuilding(x, z, width, height, depth) {
            const geom = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshStandardMaterial({ 
                color: buildingColors[Math.floor(Math.random() * buildingColors.length)], 
                roughness: 0.4,
                metalness: 0.2
            });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.set(x, height / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const box = new THREE.Box3().setFromObject(mesh);
            obstacles.push({ mesh, box });
        }

        // ビルを街の区画に綺麗に配置（道路スペースを十分に確保）
        const bSize = 16;
        const offset = 26;
        for (let xPos of [-offset, offset]) {
            for (let zPos of [-offset, offset]) {
                const h = 25 + Math.random() * 20;
                createBuilding(xPos, zPos, bSize, h, bSize);
            }
        }

        // --- 1. アイテムの配置（ビルに埋まらず、安全な道路・地面の上に配置） ---
        const items = [];
        const itemGeo = new THREE.DodecahedronGeometry(0.7);
        const itemMat = new THREE.MeshStandardMaterial({ 
            color: 0xffd700, 
            emissive: 0xffa500, 
            emissiveIntensity: 0.6,
            roughness: 0.1 
        });

        // ビルに一切かぶらない安全な道路座標
        const itemCoords = [
            { x: 0, z: -45 },
            { x: 0, z: 45 },
            { x: -45, z: 0 },
            { x: 45, z: 0 },
            { x: 0, z: 0 }
        ];

        let collectedCount = 0;
        itemCoords.forEach((coord, idx) => {
            const itemMesh = new THREE.Mesh(itemGeo, itemMat);
            // Y座標を1.0に設定して地面や床下に埋まるのを完全に防止
            itemMesh.position.set(coord.x, 1.0, coord.z);
            itemMesh.castShadow = true;
            scene.add(itemMesh);
            items.push({ mesh: itemMesh, collected: false, id: idx });
        });

        // --- プレイヤー操作 (PointerLockControls) ---
        const controls = new THREE.PointerLockControls(camera, document.body);
        
        document.body.addEventListener('click', () => {
            controls.lock();
        });

        const player = {
            radius: 0.8,
            speed: 0.12,
            sprintMultiplier: 1.6,
            position: camera.position
        };
        player.position.set(0, 2, 50); // 初期スポーン位置（道路上）

        const keys = { forward: false, backward: false, left: false, right: false, shift: false };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.forward = true;
            if (e.code === 'KeyS') keys.backward = true;
            if (e.code === 'KeyA') keys.left = true;
            if (e.code === 'KeyD') keys.right = true;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.forward = false;
            if (e.code === 'KeyS') keys.backward = false;
            if (e.code === 'KeyA') keys.left = false;
            if (e.code === 'KeyD') keys.right = false;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = false;
        });

        // --- 3. モンスターの作成とビル貫通防止（コリジョン適用） ---
        const monsters = [];
        const monsterGeo = new THREE.CapsuleGeometry(0.9, 1.8, 4, 8);
        const monsterMat = new THREE.MeshStandardMaterial({ color: 0xff3355, roughness: 0.3, emissive: 0x330011 });

        for (let i = 0; i < 3; i++) {
            const mesh = new THREE.Mesh(monsterGeo, monsterMat);
            // ビルに埋まらない安全な初期配置
            mesh.position.set((i - 1) * 30, 1.8, -25);
            mesh.castShadow = true;
            scene.add(mesh);

            monsters.push({
                mesh: mesh,
                radius: 0.9,
                speed: 0.038
            });
        }

        // --- 共通衝突判定ロジック ---
        function checkCollision(pos, radius) {
            const box = new THREE.Box3(
                new THREE.Vector3(pos.x - radius, 0, pos.z - radius),
                new THREE.Vector3(pos.x + radius, 5, pos.z + radius)
            );

            // ビルとの判定
            for (let obs of obstacles) {
                if (box.intersectsBox(obs.box)) return true;
            }

            // 透明な外周壁との判定（場外防止）
            for (let wall of boundaryWalls) {
                if (box.intersectsBox(wall.box)) return true;
            }

            return false;
        }

        // --- メインループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (controls.isLocked) {
                // プレイヤー移動ベクトル計算
                let currentSpeed = player.speed * (keys.shift ? player.sprintMultiplier : 1.0);
                const moveDir = new THREE.Vector3();
                
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();

                const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                side.y = 0;
                side.normalize();

                if (keys.forward) moveDir.add(forward);
                if (keys.backward) moveDir.add(forward.clone().negate());
                if (keys.right) moveDir.add(side);
                if (keys.left) moveDir.add(side.clone().negate());
                moveDir.normalize();

                if (moveDir.lengthSq() > 0) {
                    // X方向の移動と判定
                    let nextX = player.position.clone();
                    nextX.x += moveDir.x * currentSpeed;
                    if (!checkCollision(nextX, player.radius)) {
                        player.position.x = nextX.x;
                    }

                    // Z方向の移動と判定
                    let nextZ = player.position.clone();
                    nextZ.z += moveDir.z * currentSpeed;
                    if (!checkCollision(nextZ, player.radius)) {
                        player.position.z = nextZ.z;
                    }
                }
            }

            // アイテムの回転アニメーション＆回収判定
            items.forEach(item => {
                if (!item.collected) {
                    item.mesh.rotation.y += 0.03;
                    item.mesh.rotation.x += 0.01;

                    // プレイヤーとの距離判定（ゲット判定）
                    const dist = new THREE.Vector3(player.position.x, 0, player.position.z)
                        .distanceTo(new THREE.Vector3(item.mesh.position.x, 0, item.mesh.position.z));
                    
                    if (dist < 1.6) {
                        item.collected = true;
                        scene.remove(item.mesh);
                        collectedCount++;
                        document.getElementById('score').innerText = `${collectedCount} / 5`;
                        
                        // 演出メッセージ表示
                        const msg = document.getElementById('msg');
                        msg.style.opacity = 1;
                        setTimeout(() => { msg.style.opacity = 0; }, 1500);

                        if (collectedCount === 5) {
                            document.getElementById('status').innerText = 'クリア！全アイテム回収！';
                            document.getElementById('status').style.color = '#00ffcc';
                        }
                    }
                }
            });

            // --- 3. モンスターの移動処理（ビル貫通防止ロジック完備） ---
            monsters.forEach(mon => {
                const targetPos = player.position;
                const dir = new THREE.Vector3().subVectors(targetPos, mon.mesh.position);
                dir.y = 0;
                dir.normalize();

                let nextPos = mon.mesh.position.clone().addScaledVector(dir, mon.speed);

                // モンスター専用のすり抜け防止ボックス判定
                let collided = false;
                const monBox = new THREE.Box3(
                    new THREE.Vector3(nextPos.x - mon.radius, 0, nextPos.z - mon.radius),
                    new THREE.Vector3(nextPos.x + mon.radius, 4, nextPos.z + mon.radius)
                );

                for (let obs of obstacles) {
                    if (monBox.intersectsBox(obs.box)) {
                        collided = true;
                        break;
                    }
                }
                for (let wall of boundaryWalls) {
                    if (monBox.intersectsBox(wall.box)) {
                        collided = true;
                        break;
                    }
                }

                if (!collided) {
                    mon.mesh.position.copy(nextPos);
                } else {
                    // ビルにぶつかった時のスマートなスライド（回り込み）移動
                    let altXPos = mon.mesh.position.clone();
                    altXPos.x += dir.x * mon.speed;
                    let boxX = new THREE.Box3(
                        new THREE.Vector3(altXPos.x - mon.radius, 0, altXPos.z - mon.radius),
                        new THREE.Vector3(altXPos.x + mon.radius, 4, altXPos.z + mon.radius)
                    );
                    let canX = !obstacles.some(o => boxX.intersectsBox(o.box)) && !boundaryWalls.some(w => boxX.intersectsBox(w.box));
                    
                    if (canX) {
                        mon.mesh.position.x = altXPos.x;
                    } else {
                        let altZPos = mon.mesh.position.clone();
                        altZPos.z += dir.z * mon.speed;
                        let boxZ = new THREE.Box3(
                            new THREE.Vector3(altZPos.x - mon.radius, 0, altZPos.z - mon.radius),
                            new THREE.Vector3(altZPos.x + mon.radius, 4, altZPos.z + mon.radius)
                        );
                        let canZ = !obstacles.some(o => boxZ.intersectsBox(o.box)) && !boundaryWalls.some(w => boxZ.intersectsBox(w.box));
                        if (canZ) {
                            mon.mesh.position.z = altZPos.z;
                        }
                    }
                }

                // プレイヤーとの接触判定（ゲームオーバー判定など）
                const pDist = new THREE.Vector3(player.position.x, 0, player.position.z)
                    .distanceTo(new THREE.Vector3(mon.mesh.position.x, 0, mon.mesh.position.z));
                if (pDist < 1.4) {
                    document.getElementById('status').innerText = 'ゲームオーバー！';
                    document.getElementById('status').style.color = '#ff3355';
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        // ウィンドウリサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
